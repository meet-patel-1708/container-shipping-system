spring.application.name=booking-service
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://containershippingsystem.c780gesimte3.ap-south-1.rds.amazonaws.com:5432/booking_service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

jwt.secret=${JWT_SECRET:}

logging.level.org.springframework.data.redis=INFO
logging.level.org.springframework.cache=INFO

spring.data.redis.host=${INFRA_HOST:localhost}
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=${INFRA_HOST:localhost}:9092
spring.kafka.consumer.group-id=booking-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

services.auth-service.url=http://localhost:8081
services.catalog-service.url=http://localhost:8082
services.fleet-service.url=http://localhost:8083

resilience4j.circuitbreaker.instances.authService.sliding-window-size=10
resilience4j.circuitbreaker.instances.authService.failure-rate-thresold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.catalogService.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogService.failure-rate-thresold=50
resilience4j.circuitbreaker.instances.catalogService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.fleetService.sliding-window-size=10
resilience4j.circuitbreaker.instances.fleetService.failure-rate-thresold=50
resilience4j.circuitbreaker.instances.fleetService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fleetService.permitted-number-of-calls-in-half-open-state=3

feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=3000

spring.jackson.serialization.write-dates-as-timestamps=false