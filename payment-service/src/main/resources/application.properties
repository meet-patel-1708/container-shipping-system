spring.application.name=payment-service
server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://containershippingsystem.c780gesimte3.ap-south-1.rds.amazonaws.com:5432/payment_service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

jwt.secret=${JWT_SECRET:}

spring.data.redis.host=${INFRA_HOST:localhost}
spring.data.redis.port=6379
spring.jackson.serialization.write-dates-as-timestamps=false

spring.kafka.bootstrap-servers=${INFRA_HOST:localhost}:9092
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest

logging.level.org.apache.kafka=WARN

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}