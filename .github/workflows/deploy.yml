name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ASG_NAME: Shipping-asg
  BUCKET: shipping-deploy-772621378889

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, catalog-service, fleet-service,
                  booking-service, payment-service, notification-service, gps-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run: mvn -B -DskipTests package
        working-directory: ${{ matrix.service }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMG=${{ secrets.DOCKERHUB_USER }}/shipping-${{ matrix.service }}
          docker build -f deploy/Dockerfile.service -t $IMG:latest -t $IMG:${{ github.sha }} ${{ matrix.service }}
          docker push $IMG:latest
          docker push $IMG:${{ github.sha }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMG=${{ secrets.DOCKERHUB_USER }}/shipping-ui
          docker build -t $IMG:latest -t $IMG:${{ github.sha }} container-shipping-ui
          docker push $IMG:latest
          docker push $IMG:${{ github.sha }}

  deploy:
    needs: [backend, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::772621378889:role/github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish compose file
        run: aws s3 cp deploy/docker-compose.yml s3://${{ env.BUCKET }}/deploy/docker-compose.yml

      - name: Replace the instance (pulls the new images)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":300}'