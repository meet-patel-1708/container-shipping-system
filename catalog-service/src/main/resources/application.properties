spring.application.name=catalog-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://containershippingsystem.c780gesimte3.ap-south-1.rds.amazonaws.com:5432/catalog_service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

# must be the same value in every service
jwt.secret=${JWT_SECRET:}

spring.kafka.bootstrap-servers=${INFRA_HOST:localhost}:9092