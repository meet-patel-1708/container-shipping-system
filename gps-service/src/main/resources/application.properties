spring.application.name=gps-service
server.port=8087

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://containershippingsystem.c780gesimte3.ap-south-1.rds.amazonaws.com:5432/gps_tracking_service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

jwt.secret=${JWT_SECRET:}

spring.data.redis.host=${INFRA_HOST:localhost}
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=${INFRA_HOST:localhost}:9092
spring.kafka.consumer.group-id=gps-service-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

services.booking-service.url=http://localhost:8084