spring.application.name=api-gateway
server.port=8080

#jwt
jwt.secret=aVKjECelvOJ4k+UyVZUfBSls4Qo/1lXsGC9DX7BU4qQ

#=========PUBLIC PATHS (skip jwt checks at gateway level)=========
gateway.security.public-paths=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/verify-email,/api/auth/resend-verification,/api/auth/accept-invite,/ws-tracking/**,/actuator/health

#==== gateway = http client ======
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000

#==== gateway:cors========
#"localhost:*" covers react, vite, angular
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=http://localhost:*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

#======== gateway: default filters
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

#========== gateway: routes

#Auth-service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/admin/staff/**,/api/admin/kyc/**,/api/careers/**,/api/admin/careers/**,/api/resignations/**,/api/admin/resignations/**

#Catalog-service
spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**

#fleet-service
spring.cloud.gateway.server.webflux.routes[2].id=fleet-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ports/**,/api/ships/**,/api/vehicles/**

#booking-service
spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/bookings/**,/api/containers/**,/api/staff/**
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[5]=PATCH
#payment-service
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**

#notification-service
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**

#gps-tracking-service(REST)
spring.cloud.gateway.server.webflux.routes[6].id=gps-tracking-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/locations/**

#gps-tracking-service (webSocket) - note the ws:// scheme
spring.cloud.gateway.server.webflux.routes[7].id=gps-tracking-websocket
spring.cloud.gateway.server.webflux.routes[7].uri=ws://localhost:8087
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/ws-tracking/**

#================ actuator
management.endpoints.web.exposure.include=health,info,gateway

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns[1]=http://127.0.0.1:*