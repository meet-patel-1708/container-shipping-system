spring.application.name=fleet-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://containershippingsystem.c780gesimte3.ap-south-1.rds.amazonaws.com:5432/fleet_service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

jwt.secret=${JWT_SECRET:}

logging.level.org.springframework.data.redis=INFO
logging.level.org.springframework.cache=INFO

spring.data.redis.host=${INFRA_HOST:localhost}
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=${INFRA_HOST:localhost}:9092